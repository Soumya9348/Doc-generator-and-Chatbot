*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:#080c18;color:#e2e8f0;min-height:100vh;overflow-x:auto}

.gw3{width:350px;height:350px;background:#DD1D21;top:30%;left:55%;animation-delay:5s}

.header{position:relative;z-index:10;text-align:center;padding:32px 20px 8px}
.header h1{font-size:28px;font-weight:800;letter-spacing:-0.8px;background:linear-gradient(135deg,#FFD500,#FACC15,#DD1D21);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;flex-wrap:wrap}

.hint{text-align:center;padding:8px;z-index:10;position:relative}
.hint span{color:#3e4a5e;font-size:10px;padding:3px 12px;border:1px solid #1a2035;border-radius:12px;background:rgba(20,25,40,0.5)}

.wrapper{position:relative;width:1800px;margin:0 auto}
/* ── Tree Canvas ── */
.tree{position:relative;z-index:5;width:100%;padding:0 40px 80px}
.tree svg{position:absolute;top:0;left:0;pointer-events:none;z-index:1}

/* ── Nodes ── */
.nd{position:absolute;z-index:10;border-radius:14px;cursor:pointer;

.nd.vis{opacity:1;transform:translateX(-50%)!important}
.nd:hover{z-index:20}

.nd-in{padding:12px 16px}
.nd-t{font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nd-s{font-size:9px;color:#64748b;margin-top:2px;line-height:1.35;word-wrap:break-word}

// ───────────────────────────────────────────────
// RENDER
// ───────────────────────────────────────────────
const tree = document.getElementById('tree');

NODES.forEach(n => {
  const el = document.createElement('div');
  el.className = `nd ${n.c}`;
  el.id = n.id;
  el.dataset.k = n.id;
  el.style.left = n.x + 'px';
  el.style.top = n.y + 'px';
  let chipHtml = '';
  if(n.ch) {
    const cc = n.ch === 'LIVE' ? 'background:rgba(16,185,129,0.12);color:#34d399' : 'background:rgba(244,114,182,0.12);color:#f472b6';
    chipHtml = `<span class="nd-chip" style="${cc}">${n.ch}</span>`;
  }
  el.innerHTML = `<div class="nd-in"><div class="nd-t"><span class="nd-ic">${n.ic}</span>${n.t}</div><div class="nd-s">${n.s}</div>${chipHtml}</div>`;
  tree.appendChild(el);
});

function gc(el){const r=el.getBoundingClientRect(),c=tree.getBoundingClientRect();return{x:r.left-c.left+r.width/2,y:r.top-c.top+r.height/2}}

function drawEdges(){
  const s=document.getElementById('svg');
  s.innerHTML='';s.setAttribute('width',tree.scrollWidth);s.setAttribute('height',tree.scrollHeight);
  EDGES.forEach(([a,b,col],i)=>{
    const ea=document.getElementById(a),eb=document.getElementById(b);if(!ea||!eb)return;
    const p1=gc(ea),p2=gc(eb),pid='e'+i;
    const dx=Math.abs(p2.x-p1.x),dy=p2.y-p1.y;
    const cp1y=p1.y+dy*0.4, cp2y=p1.y+dy*0.6;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M${p1.x},${p1.y} C${p1.x},${cp1y} ${p2.x},${cp2y} ${p2.x},${p2.y}`);
    path.setAttribute('id',pid);path.setAttribute('stroke',col);path.setAttribute('stroke-width','1.2');
    path.setAttribute('fill','none');path.setAttribute('opacity','0.18');
    s.appendChild(path);
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r','2');c.setAttribute('fill',col);c.setAttribute('opacity','0.6');
    const am=document.createElementNS('http://www.w3.org/2000/svg','animateMotion');
    am.setAttribute('dur',`${2+Math.random()*2}s`);am.setAttribute('repeatCount','indefinite');
    const mp=document.createElementNS('http://www.w3.org/2000/svg','mpath');
    mp.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href','#'+pid);
    am.appendChild(mp);c.appendChild(am);s.appendChild(c);
  });
}

// Staggered entrance
window.addEventListener('load',()=>{
  const nds=document.querySelectorAll('.nd');
  nds.forEach((n,i)=>setTimeout(()=>n.classList.add('vis'),80+i*40));
  setTimeout(drawEdges,80+nds.length*40+300);
});
window.addEventListener('resize',drawEdges);

// Click handler
document.querySelectorAll('.nd[data-k]').forEach(n=>{
  n.addEventListener('click',()=>{
    const k=n.dataset.k,d=INFO[k];if(!d)return;
    document.querySelectorAll('.nd').forEach(x=>x.classList.remove('active'));n.classList.add('active');
    document.getElementById('pi').textContent=d.i;
    document.getElementById('pt').textContent=d.t;
    const b=document.getElementById('pb');b.textContent=d.sl;b.className='pb '+(d.s==='live'?'live':'proposed');
    document.getElementById('pd').innerHTML=d.d;
    document.getElementById('pf').innerHTML=d.f.map(x=>'<li>'+x+'</li>').join('');
    document.getElementById('ov').classList.add('sh');
  });
});
function cl(){document.getElementById('ov').classList.remove('sh');document.querySelectorAll('.nd').forEach(n=>n.classList.remove('active'));}
document.getElementById('ov').addEventListener('click',e=>{if(e.target===e.currentTarget)cl();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cl();});
</script>
